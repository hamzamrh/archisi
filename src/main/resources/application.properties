spring.application.name=hamzamraihi4IEIT

# DB Configuration :
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc1?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Web Server (Tomcat) configuration
server.port=8089

spring.web.error.include-message=always


spring.jackson.deserialization.fail-on-null-for-primitives=false

# JPA : session ouverte pendant la serialisation JSON (associations LAZY lues par Jackson)
spring.jpa.open-in-view=true

# SpringDoc : documentation activee volontairement (projet de developpement)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
logging.level.org.springdoc.core.events.SpringDocAppInitializer=ERROR
